<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/red_vortex.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/oswald-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Vortex Athletics - Transform Youth Athletes Into Champions</title>
    <meta name="description" content="Vortex Athletics is a premier youth athletic development center. Gymnastics, ninja, strength, athleticism programs, classes, events, and development-first coaching." />
    <!-- Consent Mode v2 defaults — must run before GTM and gtag.js so every tag starts denied until the cookie banner grants consent -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      // Preserve attribution across Vortex-owned domains while preventing ad-click
      // identifiers from being sent when advertising storage is denied.
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      gtag('set', 'linker', {
        domains: [
          'vortexathletics.com',
          'vortex-gymnastics.com',
          'vortex-lacross.com',
          'vortex-conditioning.com',
          'vortex-football.com',
          'vortex-basketball.com',
          'vortex-track.com',
          'vortex-fit.com',
          'vortex-athlete.com',
          'vortex-soccer.com',
          'vortex-reps.com'
        ]
      });
      // Load optional analytics only after the visitor grants analytics or
      // marketing consent. Queued gtag/dataLayer commands are preserved.
      window.loadVortexAnalytics = function () {
        if (window.__vortexAnalyticsLoaded) return;
        window.__vortexAnalyticsLoaded = true;

        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-T38PSLXX');

        var googleTag = document.createElement('script');
        googleTag.async = true;
        googleTag.src = 'https://www.googletagmanager.com/gtag/js?id=G-XDE178DQWY';
        document.head.appendChild(googleTag);
      };

      gtag('js', new Date());
      gtag('config', 'G-XDE178DQWY', { send_page_view: false });
    </script>
    <!-- CDN dns-prefetch injected in main.tsx when VITE_CDN_BASE_URL is set (opt-in preconnect via VITE_CDN_PRECONNECT=true) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
