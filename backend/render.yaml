# Render Blueprint — Web Service for Vortex API
# Dashboard: New > Blueprint > connect repo, or set these on an existing service manually.
services:
  - type: web
    name: vortex-backend
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://www.vortexathletics.com
      - key: PUBLIC_APP_URL
        value: https://www.vortexathletics.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: frontdesk@vortexathletics.com
      - key: BILLING_ALERT_EMAIL
        value: billing@vortexathletics.com
      - key: BILLING_REPLY_TO
        value: billing@vortexathletics.com
      # Optional — portal message attachments, exercise media, form-review video
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: cron
    name: vortex-daily-roster
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    # 11:00 UTC is 7:00 AM EDT / 6:00 AM EST for the Eastern-time roster date.
    schedule: "0 11 * * *"
    buildCommand: npm install
    startCommand: npm run roster:daily
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: frontdesk@vortexathletics.com
      - key: DAILY_ROSTER_EMAIL
        value: team@vortexathletics.com
  - type: cron
    name: vortex-recurring-billing
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    # Daily execution makes charge posting and the first-of-month household
    # invoice build resilient to missed runs; both are idempotent.
    schedule: "10 6 * * *"
    buildCommand: npm install
    startCommand: npm run billing:recurring
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_ENABLED
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: BILLING_ALERT_EMAIL
        value: billing@vortexathletics.com
      - key: BILLING_REPLY_TO
        value: billing@vortexathletics.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
  - type: cron
    name: vortex-stripe-reconciliation
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    schedule: "15 7 * * *"
    buildCommand: npm install
    startCommand: npm run stripe:reconcile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_ENABLED
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: BILLING_ALERT_EMAIL
        value: billing@vortexathletics.com
      - key: BILLING_REPLY_TO
        value: billing@vortexathletics.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
