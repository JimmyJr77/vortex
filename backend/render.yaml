# Render Blueprint — Web Service for Vortex API
# Dashboard: New > Blueprint > connect repo, or set these on an existing service manually.
services:
  - type: web
    name: vortex-backend
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: npm install
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Persistent 64-character hexadecimal key; keep a recoverable secret-store backup.
      - key: PAYROLL_DOCUMENT_KEY
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_REDIRECT_URI
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        value: sandbox
      - key: PAYROLL_COMPLIANCE_SCHEDULER_ENABLED
        value: "true"
      - key: FRONTEND_URL
        value: https://www.vortexathletics.com
      - key: PUBLIC_APP_URL
        value: https://www.vortexathletics.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: frontdesk@vortexathletics.com
      - key: BILLING_ALERT_EMAIL
        value: billing@vortexathletics.com
      - key: BILLING_REPLY_TO
        value: billing@vortexathletics.com
      - key: BILLING_HOUSEHOLD_INVOICE_ENABLED
        value: "true"
      - key: BILLING_HOUSEHOLD_AUTO_ACTIVATE_ENABLED
        value: "true"
      - key: BILLING_COLLECTION_CUTOVER_ENABLED
        value: "true"
      - key: BILLING_CANONICAL_READ_MODE
        value: shadow
      - key: BILLING_STRIPE_SUBSCRIPTION_CREATION_MODE
        value: disabled
      - key: BILLING_CLASS_SUBSCRIPTION_CREATION_MODE
        value: household_only
      # Optional — portal message attachments, exercise media, form-review video
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: cron
    name: vortex-billing-legacy-telemetry-heartbeat
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    # Record the UTC observation day near its end. Missing or unhealthy days
    # make the legacy-retirement audit fail closed.
    schedule: "50 23 * * *"
    buildCommand: npm install
    startCommand: npm run billing:retirement:heartbeat -- --apply
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
  - type: cron
    name: vortex-daily-roster
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    # 11:00 UTC is 7:00 AM EDT / 6:00 AM EST for the Eastern-time roster date.
    schedule: "0 11 * * *"
    buildCommand: npm install
    startCommand: npm run roster:daily
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        value: frontdesk@vortexathletics.com
      - key: DAILY_ROSTER_EMAIL
        value: team@vortexathletics.com
  - type: cron
    name: vortex-stripe-reconciliation
    runtime: node
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    schedule: "15 7 * * *"
    buildCommand: npm install
    # One collector job: reconcile receipts first, then post and collect due bills.
    startCommand: npm run billing:daily
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_ENABLED
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: BILLING_HOUSEHOLD_INVOICE_ENABLED
        value: "true"
      - key: BILLING_HOUSEHOLD_AUTO_ACTIVATE_ENABLED
        value: "true"
      - key: BILLING_COLLECTION_CUTOVER_ENABLED
        value: "true"
      - key: BILLING_CANONICAL_READ_MODE
        value: shadow
      - key: BILLING_STRIPE_SUBSCRIPTION_CREATION_MODE
        value: disabled
      - key: BILLING_CLASS_SUBSCRIPTION_CREATION_MODE
        value: household_only
      - key: STRIPE_RECONCILIATION_LOOKBACK_HOURS
        value: "168"
      - key: BILLING_ALERT_EMAIL
        value: billing@vortexathletics.com
      - key: BILLING_REPLY_TO
        value: billing@vortexathletics.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_REPLY_TO
        sync: false
