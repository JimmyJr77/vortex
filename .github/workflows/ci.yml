name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortex_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vortex_migration_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Verify deploy migrations on disposable PostgreSQL
        env:
          RUN_DISPOSABLE_POSTGRES_MIGRATION_TESTS: "true"
          BILLING_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_migration_ci
        run: npm run test:migrations:postgres --prefix backend

      - name: Run launch checks
        run: npm run ci:checks

      - name: Verify billing worker connection recovery on disposable PostgreSQL
        env:
          BILLING_WORKER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_migration_ci
        run: node --test backend/billing/__tests__/recurringBillingProgress.postgres.test.js

      - name: Verify account history, revenue and family retention on disposable PostgreSQL
        env:
          BILLING_TURNOVER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_billing_test
          DASHBOARD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_dashboard_test
          NEW_ADMIN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_new_admin_dev
        run: |
          node --input-type=module <<'JS'
          import pg from './backend/node_modules/pg/lib/index.js'
          const db=new pg.Client({connectionString:'postgresql://postgres:postgres@127.0.0.1:5432/postgres'})
          await db.connect()
          try {
            await db.query('CREATE DATABASE vortex_billing_test')
            await db.query('CREATE DATABASE vortex_dashboard_test')
            await db.query('CREATE DATABASE vortex_new_admin_dev')
          } finally { await db.end() }
          JS
          node --test backend/billing/__tests__/billingTurnover.postgres.test.js backend/platform/__tests__/adminDashboardRefunds.postgres.test.js backend/newAdmin/__tests__/enrollmentTrend.postgres.test.js backend/newAdmin/__tests__/billingDashboard.postgres.test.js backend/billing/__tests__/accountingReport.postgres.test.js backend/billing/__tests__/accountingBalances.postgres.test.js backend/newAdmin/__tests__/familyWorkspace.postgres.test.js backend/newAdmin/__tests__/sharedAccountRecords.postgres.test.js

      - name: Run complete backend unit suite
        # Timing assertions need an uncontended CPU on shared GitHub runners.
        run: npm test --prefix backend -- --test-concurrency=1

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        # Hosted Ubuntu runners already include Chromium's runtime libraries.
        # Avoid an apt mirror dependency just to install optional font packages.
        # The browser tests still fail if any required library is unavailable.
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run client-critical E2E smoke tests
        env:
          NEW_ADMIN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vortex_new_admin_dev
        run: npm run test:e2e:smoke

      - name: Run backend integration tests (staging-gated)
        env:
          RUN_INTEGRATION_TESTS: "true"
          INTEGRATION_BASE_URL: ${{ secrets.INTEGRATION_BASE_URL }}
        if: ${{ vars.RUN_INTEGRATION_TESTS == 'true' && env.INTEGRATION_BASE_URL != '' }}
        run: npm run test:integration:backend
