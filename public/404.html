<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Vortex Athletics</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #070707;
        color: #fff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 20%, rgb(185 28 28 / 30%), transparent 32rem),
          linear-gradient(145deg, #050505, #171717);
      }

      main {
        width: min(44rem, calc(100% - 2rem));
        padding: 3rem;
        border: 1px solid rgb(255 255 255 / 14%);
        border-radius: 1.5rem;
        background: rgb(0 0 0 / 58%);
        box-shadow: 0 2rem 5rem rgb(0 0 0 / 45%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.75rem;
        color: #ef4444;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 8vw, 4.75rem);
        line-height: 1;
      }

      p {
        margin: 1.5rem auto 0;
        max-width: 34rem;
        color: #d4d4d4;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.2rem;
        border: 2px solid #ef4444;
        border-radius: 0.75rem;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }

      a:first-child {
        background: #dc2626;
      }

      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Page not found</p>
      <h1>That page isn&rsquo;t here.</h1>
      <p>
        The address may be outdated or mistyped. Choose the Vortex program you were looking for.
      </p>
      <nav aria-label="Helpful destinations">
        <a href="https://vortexathletics.com/">Vortex Athletics</a>
        <a href="https://www.vortex-gymnastics.com/">Vortex Gymnastics</a>
